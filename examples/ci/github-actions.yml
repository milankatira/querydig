# .github/workflows/querydig.yml
name: querydig
on:
  pull_request:
  push:
    branches: [main]
jobs:
  querydig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SARIF for code scanning
        run: npx -y querydig --format sarif -o querydig.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: querydig.sarif
      - name: Gate on new high/critical issues
        run: npx -y querydig --diff origin/${{ github.base_ref || 'main' }} --fail-on high
