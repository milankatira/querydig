name: 'querydig: N+1 & slow query scanner'
description: 'Find N+1, slow and unoptimized MongoDB/SQL queries in pull requests (JS/TS, Python, Go, Java, Ruby, PHP).'
author: 'milankatira'
branding:
  icon: 'database'
  color: 'orange'

inputs:
  path:
    description: 'Project root to scan.'
    default: '.'
  version:
    description: 'querydig version from npm (e.g. 0.5.0). Defaults to latest.'
    default: 'latest'
  fail-on:
    description: 'Fail the job if a finding is at or above this severity: critical, high, medium, low, or none.'
    default: 'high'
  min-severity:
    description: 'Hide findings below this severity.'
    default: 'low'
  diff:
    description: 'Only scan changed files. "auto" = the PR base branch on pull_request events (full scan otherwise), "" = always full scan, or any git ref.'
    default: 'auto'
  baseline:
    description: 'Path to a baseline file; findings recorded in it are ignored.'
    default: ''
  sarif:
    description: 'Upload findings to GitHub code scanning (needs permissions: security-events: write).'
    default: 'true'
  summary:
    description: 'Write a Markdown report to the job summary.'
    default: 'true'
  comment:
    description: 'On pull requests, post the report as one PR comment that is updated on every push (needs permissions: pull-requests: write).'
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment.'
    default: ${{ github.token }}
  uri:
    description: 'Optional read-only MongoDB/Postgres URI for live evidence. Pass it from a secret.'
    default: ''
  args:
    description: 'Extra arguments passed to every querydig run.'
    default: ''
  node-version:
    description: 'Node.js version to set up (querydig needs 22.12+). Set to "" to use the runner''s Node.'
    default: '22'

outputs:
  total:
    description: 'Number of findings.'
    value: ${{ steps.result.outputs.total }}
  critical:
    description: 'Number of critical findings.'
    value: ${{ steps.result.outputs.critical }}
  high:
    description: 'Number of high findings.'
    value: ${{ steps.result.outputs.high }}
  grade:
    description: 'Query health grade (A-F).'
    value: ${{ steps.result.outputs.grade }}
  score:
    description: 'Query health score (0-100).'
    value: ${{ steps.result.outputs.score }}
  sarif-file:
    description: 'Path of the SARIF report.'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - id: scan
      shell: bash
      env:
        QD_PATH: ${{ inputs.path }}
        QD_VERSION: ${{ inputs.version }}
        QD_MIN: ${{ inputs.min-severity }}
        QD_DIFF: ${{ inputs.diff }}
        QD_BASELINE: ${{ inputs.baseline }}
        QD_ARGS: ${{ inputs.args }}
        QD_SUMMARY: ${{ inputs.summary }}
        QD_COMMENT: ${{ inputs.comment }}
        QD_BASE_REF: ${{ github.base_ref }}
        QD_EVENT: ${{ github.event_name }}
        QUERYDIG_DB_URI: ${{ inputs.uri }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/querydig"
        mkdir -p "$out"

        diff_ref=""
        if [ "$QD_DIFF" = "auto" ]; then
          if [ "$QD_EVENT" = "pull_request" ] || [ "$QD_EVENT" = "pull_request_target" ]; then
            diff_ref="origin/${QD_BASE_REF}"
          fi
        elif [ -n "$QD_DIFF" ]; then
          diff_ref="$QD_DIFF"
        fi

        # --diff compares against the merge base, which a shallow checkout doesn't have.
        if [ -n "$diff_ref" ]; then
          if [ "$(git -C "$QD_PATH" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$QD_PATH" fetch --no-tags --quiet --unshallow origin
          fi
          if [ -n "$QD_BASE_REF" ] && [ "$diff_ref" = "origin/${QD_BASE_REF}" ]; then
            git -C "$QD_PATH" fetch --no-tags --quiet origin "${QD_BASE_REF}:refs/remotes/origin/${QD_BASE_REF}"
          fi
        fi

        common=("$QD_PATH" --min-severity "$QD_MIN")
        [ -n "$diff_ref" ] && common+=(--diff "$diff_ref")
        [ -n "$QD_BASELINE" ] && common+=(--baseline "$QD_BASELINE")
        # shellcheck disable=SC2206
        [ -n "$QD_ARGS" ] && common+=($QD_ARGS)

        qd() { npx -y "querydig@${QD_VERSION}" "$@"; }

        qd "${common[@]}" --format json -o "$out/querydig.json" --fail-on none
        qd "${common[@]}" --format sarif -o "$out/querydig.sarif" --fail-on none
        if [ "$QD_SUMMARY" = "true" ] || [ "$QD_COMMENT" = "true" ]; then
          qd "${common[@]}" --format md --fail-on none > "$out/querydig.md"
          [ "$QD_SUMMARY" = "true" ] && cat "$out/querydig.md" >> "$GITHUB_STEP_SUMMARY"
          echo "md-file=$out/querydig.md" >> "$GITHUB_OUTPUT"
        fi

        echo "json-file=$out/querydig.json" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$out/querydig.sarif" >> "$GITHUB_OUTPUT"

    - id: result
      shell: bash
      env:
        QD_JSON: ${{ steps.scan.outputs.json-file }}
        QD_SARIF: ${{ steps.scan.outputs.sarif-file }}
        QD_FAIL_ON: ${{ inputs.fail-on }}
        QD_PATH: ${{ inputs.path }}
      run: |
        node --input-type=module -e '
          import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
          import { join } from "node:path";
          const s = JSON.parse(readFileSync(process.env.QD_JSON, "utf8"));
          const out = process.env.GITHUB_OUTPUT;
          const set = (k, v) => appendFileSync(out, `${k}=${v}\n`);
          // SARIF paths are relative to the scan root; code scanning needs them relative to the repo.
          const root = (process.env.QD_PATH || ".").replace(/\/+$/, "");
          if (root !== "." && root !== "") {
            const sarif = JSON.parse(readFileSync(process.env.QD_SARIF, "utf8"));
            for (const run of sarif.runs) for (const r of run.results ?? []) for (const l of r.locations ?? []) {
              const a = l.physicalLocation?.artifactLocation;
              if (a?.uri) a.uri = join(root, a.uri);
            }
            writeFileSync(process.env.QD_SARIF, JSON.stringify(sarif));
          }
          set("total", s.findings.length);
          set("critical", s.bySeverity.critical ?? 0);
          set("high", s.bySeverity.high ?? 0);
          set("grade", s.grade);
          set("score", s.score);
          const rank = { info: 0, low: 1, medium: 2, high: 3, critical: 4 };
          const failOn = process.env.QD_FAIL_ON;
          if (failOn && failOn !== "none") {
            if (!(failOn in rank)) { console.error(`querydig: unknown fail-on "${failOn}"`); process.exit(2); }
            const failing = s.findings.filter((f) => rank[f.severity] >= rank[failOn]);
            for (const f of failing.slice(0, 50)) {
              const file = join(process.env.QD_PATH || ".", f.file);
              const data = (v) => String(v).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              const prop = (v) => data(v).replace(/:/g, "%3A").replace(/,/g, "%2C");
              console.log(`::error file=${prop(file)},line=${f.line},col=${f.column},title=${prop(`${f.ruleId} ${f.title}`)}::${data(f.message)}`);
            }
            if (failing.length) { console.error(`querydig: ${failing.length} finding(s) at or above "${failOn}"`); process.exitCode = 1; }
          }
          console.log(`querydig: ${s.findings.length} finding(s), grade ${s.grade} (${s.score}/100)`);
        '

    - name: PR comment
      if: >-
        always() && inputs.comment == 'true' && steps.scan.outputs.md-file != '' &&
        (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QD_MD: ${{ steps.scan.outputs.md-file }}
        QD_TOTAL: ${{ steps.result.outputs.total }}
        QD_PR: ${{ github.event.pull_request.number }}
        QD_REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        marker='<!-- querydig-report -->'
        existing=$(gh api "repos/$QD_REPO/issues/$QD_PR/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty" 2>/dev/null | head -n1)
        # Nothing found and nothing posted before: stay quiet.
        if [ "${QD_TOTAL:-0}" = "0" ] && [ -z "$existing" ]; then exit 0; fi
        body_file="${RUNNER_TEMP}/querydig-comment.md"
        { echo "$marker"; head -c 60000 "$QD_MD"; } > "$body_file"
        if [ "$(wc -c < "$QD_MD")" -gt 60000 ]; then
          printf '\n\n_Report truncated. See the job summary for the full list._\n' >> "$body_file"
        fi
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$QD_REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null
        else
          gh api -X POST "repos/$QD_REPO/issues/$QD_PR/comments" -F body=@"$body_file" >/dev/null
        fi || echo "::warning::querydig: could not post the PR comment. Add 'pull-requests: write' to the job permissions (forked PRs can't be commented on with the default token)."
        exit 0

    - if: always() && inputs.sarif == 'true' && steps.scan.outputs.sarif-file != ''
      # Code scanning needs GitHub Advanced Security on private repos: don't fail the job without it.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: querydig
